[build]
  command = "pnpm exec playwright install chromium && pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # No definir PRERENDER_ALLOW_OFFLINE en producción: el build debe fallar si la API no responde.

# Dominio canónico (una sola versión; sin cadenas)
[[redirects]]
  from = "https://sanblasfrontend.netlify.app/*"
  to = "https://parroquiasanblas.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.parroquiasanblas.org/*"
  to = "https://parroquiasanblas.org/:splat"
  status = 301
  force = true

# Sin trailing slash canónico (/horarios/ → /horarios)
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301
  force = true

# Auth + dashboard: SPA CSR (incl. enlaces por correo)
[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/recuperar-contrasena"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/reset-password"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/activar-cuenta"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dashboard/*"
  to = "/index.html"
  status = 200

# Públicas: HTML prerenderizado hace shadowing; si falta, fallback SPA.
[[redirects]]
  from = "/sobre-nosotros"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/historia"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/horarios"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/contacto"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/eventos"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/bautizos"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/solicitudes-catequesis"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/solicitudes-cica"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/solicitudes-catequesis-bautismo"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/solicitudes-sacramentos"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/donaciones"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 404

# URL desconocida: 404 real
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/404.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; frame-src 'self' https://www.google.com/recaptcha/ https://maps.google.com https://www.youtube.com; img-src 'self' data: blob: https://images.unsplash.com https://res.cloudinary.com https://ingsanblasback-production.up.railway.app; connect-src 'self' https://ingsanblasback-production.up.railway.app; font-src 'self' https://fonts.gstatic.com; manifest-src 'self';"
