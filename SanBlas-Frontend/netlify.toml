[build]
  command = "pnpm exec playwright install chromium && pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # No definir PRERENDER_ALLOW_OFFLINE en producción: el build debe fallar si la API no responde.

# Dominio canónico (una sola versión; sin cadenas)
[[redirects]]
  from = "https://sanblasfrontend.netlify.app/*"
  to = "https://parroquiasanblas.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.parroquiasanblas.org/*"
  to = "https://parroquiasanblas.org/:splat"
  status = 301
  force = true

# Auth + dashboard: SPA CSR (incl. enlaces por correo)
[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/recuperar-contrasena"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/reset-password"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/activar-cuenta"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/dashboard/*"
  to = "/index.html"
  status = 200
  force = true

# Públicas sin trailing slash: evita 301 de Pretty URLs (/horarios → /horarios/)
# force sirve el HTML prerenderizado en /ruta/index.html con 200.
[[redirects]]
  from = "/sobre-nosotros/"
  to = "/sobre-nosotros"
  status = 301
  force = true

[[redirects]]
  from = "/sobre-nosotros"
  to = "/sobre-nosotros/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/historia/"
  to = "/historia"
  status = 301
  force = true

[[redirects]]
