  to = "/404.html"
  status = 404
  force = true

# URL desconocida: 404 real (force para no caer en SPA/home)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/404.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; frame-src 'self' https://www.google.com/recaptcha/ https://maps.google.com https://www.youtube.com; img-src 'self' data: blob: https://images.unsplash.com https://res.cloudinary.com https://ingsanblasback-production.up.railway.app; connect-src 'self' https://ingsanblasback-production.up.railway.app; font-src 'self' https://fonts.gstatic.com; manifest-src 'self';"
